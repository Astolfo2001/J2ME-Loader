name: Build J2ME-Loader APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create dummy keystore properties
      run: |
        echo "storePassword=dummy" > keystore.properties
        echo "keyPassword=dummy" >> keystore.properties
        echo "keyAlias=dummy" >> keystore.properties
        echo "storeFile=dummy.jks" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK Variants
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: j2me-loader-apks
        path: |
          app/build/outputs/apk/**/*.apk
          build/outputs/apk/**/*.apk
